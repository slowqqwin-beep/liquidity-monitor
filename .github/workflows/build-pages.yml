name: Build & Deploy Pages

on:
  workflow_dispatch:
  schedule:
    # Every hour — catch MM calendar updates promptly
    - cron: "0 * * * *"
    # Also run at Singapore market hours: 08:00 & 20:00 SGT (00:00 & 12:00 UTC)
    - cron: "0 0,12 * * *"
  push:
    branches: [main]
    paths:
      - "fed_reaction_dashboard.md"
      - "risk_dashboard_latest.md"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/build-pages.yml"

permissions:
  contents: write

env:
  MM_CALENDAR_ICS_URL: ${{ secrets.MM_CALENDAR_ICS_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch MM Calendar
        run: python scripts/fetch_mm_calendar.py

      - name: Update Event Window
        run: python scripts/update_event_window.py

      - name: Build Site
        run: python scripts/build_site.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/mm_calendar.json risk_dashboard_latest.md docs/ || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update pages $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
